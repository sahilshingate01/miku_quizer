<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miku Quizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="avatar-ring">
          <div class="avatar-core">39</div>
        </div>
        <div class="title-group">
          <h1>Miku Quizer</h1>
          <div class="status-badge" id="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-text">Checking...</span>
          </div>
        </div>
      </div>
      <button class="icon-btn" id="btn-options" title="Open Settings">⚙️</button>
    </header>

    <!-- Google / ChatGPT OAuth Login Card -->
    <div class="auth-card" id="auth-login-card" style="display: none;">
      <div class="auth-info">
        <span class="auth-icon">🔑</span>
        <div class="auth-text-wrap">
          <div class="auth-title">Sign In with ChatGPT / Google</div>
          <div class="auth-desc">Enable 99% accuracy with GPT-5.4 reasoning</div>
        </div>
      </div>
      <button class="btn btn-google-login" id="btn-google-login">
        <svg class="google-icon" viewBox="0 0 24 24" width="15" height="15">
          <path fill="#EA4335" d="M12 5c1.7 0 3 .7 3.9 1.5l2.9-2.9C17 1.9 14.7 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2c0 2.8.7 5.5 1.9 7.8l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 17C3.7 20.7 7.5 23.5 12 23.5z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </div>

    <!-- Authenticated User Profile Bar -->
    <div class="user-profile-bar" id="user-profile-bar" style="display: none;">
      <div class="user-profile-info">
        <div class="user-avatar-badge">👤</div>
        <div class="user-profile-details">
          <div class="user-profile-email" id="user-profile-email">Connecting...</div>
          <div class="user-profile-status">🟢 GPT-5.4 OAuth Connected</div>
        </div>
      </div>
      <button class="btn-auth-action" id="btn-re-auth" title="Re-authenticate">🔄</button>
    </div>

    <!-- Master Assistant Activation Switch -->
    <div class="activation-card" id="activation-card">
      <button class="btn btn-activate" id="btn-toggle-assistant">
        <span id="activate-icon">⚡</span>
        <span id="activate-text">Start Assistant on Tab</span>
      </button>
    </div>

    <!-- Metrics Cards Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🔍</div>
        <div class="stat-value" id="stat-detected">0</div>
        <div class="stat-label">Detected</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🤖</div>
        <div class="stat-value" id="stat-requests">0</div>
        <div class="stat-label">AI Queries</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value" id="stat-cache">0</div>
        <div class="stat-label">Cached</div>
      </div>
    </section>

    <!-- Current Question Snippet -->
    <section class="card question-card">
      <div class="card-header">
        <span class="card-title">Live Question</span>
        <span class="q-tag" id="live-q-badge">None</span>
      </div>
      <div class="q-snippet" id="live-q-text">
        No active quiz question detected on the current tab.
      </div>
    </section>

    <!-- Host Site Banner -->
    <section class="site-banner">
      <span class="site-icon">🌐</span>
      <span class="site-name" id="current-site-name">Current Tab</span>
    </section>

    <!-- Action Buttons -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button class="btn btn-primary" id="btn-scan-now">
        <span>🔍</span> Scan / Solve
      </button>
      <button class="btn btn-primary" id="btn-popup-select-next" style="background: linear-gradient(135deg, #00F5FF, #39C5BB);">
        <span>⚡</span> Select & Next
      </button>
    </div>

    <!-- Action Buttons -->
    <footer class="actions">
      <button class="btn btn-secondary" id="btn-clear-cache">
        <span>🗑️</span> Clear Cache
      </button>
      <button class="btn btn-toggle" id="btn-toggle-site">
        <span id="site-toggle-icon">🛡️</span> <span id="site-toggle-text">Disable on Site</span>
      </button>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
